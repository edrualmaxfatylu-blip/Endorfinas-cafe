<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endorfina Chocolatería y Café</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #2c0e19, #4a1529, #1a080f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            color: #2b2b2b;
        }
        .card {
            background: #fffcf8;
            width: 100%;
            max-width: 400px;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            text-align: center;
            border: 1px solid rgba(74,21,41,0.12);
        }
        .banner {
            width: 100%;
            height: 160px;
            background-image: url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .banner::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 60px;
            background: linear-gradient(to top, #fffcf8, transparent);
        }
        .profile-container {
            position: relative;
            margin-top: -75px;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid #fffcf8;
            object-fit: cover;
            box-shadow: 0 15px 30px rgba(74,21,41,0.3);
        }
        .content { padding: 0 30px 36px; }
        h1 { 
            font-size: 1.75rem; 
            color: #4a1529; 
            font-weight: 800; 
            margin-bottom: 8px; 
            letter-spacing: -0.5px;
        }
        .subtitle { 
            font-size: 1rem; 
            color: #8c4156; 
            margin-bottom: 32px; 
            font-weight: 500;
        }
        
        .bank-section { margin-bottom: 32px; }
        .divider-label {
            display: flex;
            align-items: center;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 800;
            color: #a87985;
            margin-bottom: 14px;
            letter-spacing: 1.5px;
        }
        .divider-label::before, .divider-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #edd8de;
        }
        .divider-label::before { margin-right: 12px; }
        .divider-label::after { margin-left: 12px; }

        .bank-btn {
            width: 100%;
            background: #ffffff;
            border: 1.5px solid #dfc2c8;
            border-radius: 24px;
            padding: 22px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
            box-shadow: 0 10px 25px rgba(74,21,41,0.06);
        }
        .bank-btn:hover { 
            border-color: #d97706;
            background: #fffbf5;
            box-shadow: 0 15px 30px rgba(217,119,6,0.12);
            transform: translateY(-3px);
        }
        .bank-btn:active { transform: scale(0.98); }
        .bank-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .bank-header h3 { font-size: 1.05rem; color: #92400e; margin: 0; font-weight: 700; }
        .copy-badge {
            margin-left: auto;
            background: #ffedd5;
            color: #b45309;
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .bank-data { font-size: 0.95rem; color: #3d1f05; line-height: 1.8; font-family: 'Courier New', Courier, monospace; font-weight: 600; }
        .bank-data strong { color: #b45309; font-family: sans-serif; }

        .btn-group { display: flex; flex-direction: column; gap: 18px; }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 22px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
        }
        .btn:hover { 
            transform: translateY(-3px); 
            filter: brightness(1.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .btn:active { transform: scale(0.97); }
        
        .btn-menu { background: #4a1529; }
        .btn-order { background: linear-gradient(135deg, #10b981, #047857); }
        .btn-review { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .btn-ig { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
        
        .footer { margin-top: 40px; font-size: 0.85rem; color: #8c4156; font-weight: 600; letter-spacing: 0.5px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="banner"></div>
        <div class="profile-container">
            <img class="profile-img" src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=400&q=80" alt="Logo Endorfina">
        </div>
        <div class="content">
            <h1>Endorfina</h1>
            <p class="subtitle">Chocolatería y Café</p>
            
            <div class="bank-section">
                <div class="divider-label">🔒 Pagos Seguros</div>
                <button onclick="navigator.clipboard.writeText('012180015679754088'); alert('¡CLABE copiada al portapapeles!');" class="bank-btn">
                    <div class="bank-header">
                        <h3>🏦 Datos para Transferencia</h3>
                        <span class="copy-badge">📋 Copiar CLABE</span>
                    </div>
                    <div class="bank-data">
                        <strong>Banco:</strong> BBVA Bancomer<br>
                        <strong>CLABE:</strong> 012 180 01567975408 8<br>
                        <strong>Beneficiario:</strong> Edgar Ruiz
                    </div>
                </button>
            </div>

            <div class="btn-group">
                <a href="https://tusitio.com/menu" class="btn btn-menu">📖 Ver Menú Digital</a>
                <a href="https://wa.me/525611107651" class="btn btn-order">💬 Pedir por WhatsApp</a>
                <a href="https://search.google.com/local/writereview?placeid=PLACE_ID_AQUI" class="btn btn-review">⭐ Califícanos en Google</a>
                <a href="https://instagram.com" class="btn btn-ig">📸 Síguenos en Instagram</a>
            </div>
            
            <div class="footer">Hecho con ♥ para Endorfina</div>
        </div>
    </div>
</body>
</html>
