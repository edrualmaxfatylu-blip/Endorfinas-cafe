<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endorfina Chocolatería y Café</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f1ea; /* Fondo crema muy suave */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            color: #3a1b24;
        }
        .card {
            background-color: #faf8f5;
            width: 100%;
            max-width: 410px;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            border: 1px solid #eedecc;
        }
        
        /* Banner superior */
        .banner {
            width: 100%;
            height: 170px;
            background-image: url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Foto de la taza de café (Latte Art) superpuesta */
        .logo-wrapper {
            position: relative;
            margin-top: -75px;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
        }
        .logo-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 6px solid #faf8f5;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(58,27,36,0.25);
            background-color: white;
        }
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content { padding: 0 22px 30px; }

        h1 {
            font-size: 1.55rem;
            color: #5c1d32;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .tagline {
            font-size: 1rem;
            color: #8a485c;
            margin-bottom: 22px;
            font-weight: 500;
        }

        /* Sección Menú & Pedidos con verde pálido elegante */
        .dashed-box {
            border: 2px dashed #d0c7bd;
            background-color: rgba(245, 242, 238, 0.7);
            border-radius: 28px;
            padding: 18px 16px;
            margin-bottom: 20px;
        }
        .dashed-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #5c1d32;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
            margin-bottom: 12px;
            transition: transform 0.2s, filter 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-pill:last-child { margin-bottom: 0; }
        .btn-pill:active { transform: scale(0.98); }

        .btn-wine {
            background-color: #5c1d32;
            color: #ffffff;
        }
        /* Verde sage/oliva pálido y sofisticado */
        .btn-soft-green {
            background-color: #a3b19b;
            color: #2f3e46;
        }

        /* Bloque de transferencia CLABE interactivo */
        .bank-box {
            border: 2px dashed #d4a373;
            background-color: #fefae0;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: left;
            cursor: pointer;
            width: 100%;
        }
        .bank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .bank-header span {
            font-size: 0.95rem;
            font-weight: 700;
            color: #bc6c25;
        }
        .copy-tag {
            background-color: #bc6c25;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
        }
        .bank-info {
            font-size: 0.88rem;
            color: #283618;
            line-height: 1.5;
            font-family: monospace;
        }

        /* Cuadrícula de tarjetas inferiores en armonía */
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .card-item {
            border-radius: 22px;
            padding: 14px 8px;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            font-weight: 75px;
            line-height: 1.25;
        }
        .card-item span.icon {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .card-wine { background-color: #5c1d32; }
        .card-soft-green { background-color: #ccd5ae; color: #344e41; }
        .card-insta { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }

        .btn-insta-wide {
            background-color: #5c1d32;
            color: white;
        }

        .footer {
            margin-top: 18px;
            font-size: 0.78rem;
            color: #8a485c;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Banner de Fondo -->
        <div class="banner"></div>

        <!-- Foto de Taza de Café (Latte Art) -->
        <div class="logo-wrapper">
            <div class="logo-circle">
                <img src="https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=600&q=80" alt="Taza de Café Latte Art">
            </div>
        </div>

        <div class="content">
            <!-- Título y Eslogan -->
            <h1>Endorfina chocolatería y café</h1>
            <p class="tagline">Un espacio para consentirte</p>

            <!-- Menú & Pedidos (Caja Punteada) -->
            <div class="dashed-box">
                <div class="dashed-title">
                    <span>☕</span> Menú & Pedidos
                </div>
                <a href="https://tusitio.com/menu" class="btn-pill btn-wine">
                    📖 Ver Menú Digital
                </a>
                <a href="https://wa.me/525611107651" class="btn-pill btn-soft-green">
                    💬 Pedir por WhatsApp<br><span style="font-size: 0.82rem; font-weight: 500;">(Sucursal Lago Viedma)</span>
                </a>
            </div>

            <!-- Transferencia bancaria fácil de copiar -->
            <button onclick="navigator.clipboard.writeText('012180015679754088'); alert('¡CLABE copiada al portapapeles!');" class="bank-box">
                <div class="bank-header">
                    <span>🏦 Datos de Transferencia</span>
                    <span class="copy-tag">Toca para copiar</span>
                </div>
                <div class="bank-info">
                    <strong>Banco:</strong> BBVA Bancomer<br>
                    <strong>CLABE:</strong> 012 180 01567975408 8<br>
                    <strong>Beneficiario:</strong> Edgar Ruiz
                </div>
            </button>

            <!-- Bloque de 3 accesos directos -->
            <div class="grid-3">
                <a href="https://maps.google.com" class="card-item card-wine">
                    <span class="icon">📍</span>
                    Ubicación y Sucursales
                </a>
                <a href="https://search.google.com/local/writereview?placeid=PLACE_ID_AQUI" class="card-item card-soft-green">
                    <span class="icon">⭐</span>
                    Califícanos en Google
                </a>
                <a href="https://instagram.com" class="card-item card-insta">
                    <span class="icon">📸</span>
                    Síguenos en Instagram
                </a>
            </div>

            <!-- Botón inferior ancho -->
            <a href="https://instagram.com" class="btn-pill btn-insta-wide">
                📸 Síguenos en Instagram
            </a>

            <!-- Pie de página -->
            <div class="footer">
                © Endorfina Chocolatería y Café | Portal Digital
            </div>
        </div>
    </div>

</body>
</html>
