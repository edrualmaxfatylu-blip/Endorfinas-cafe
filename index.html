<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endorfina Chocolatería y Café</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #11070a; /* Fondo ultra oscuro */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #f7e6ea;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            background-color: #1a0b12; /* Color de la app estilo dark mode */
            min-height: 100vh;
            position: relative;
            padding-bottom: 40px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }
        
        /* Banner con degradado oscuro hacia abajo */
        .banner {
            width: 100%;
            height: 190px;
            background-image: url('https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=600&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        /* Logo en texto */
        .logo-wrapper {
            position: relative;
            margin-top: -85px;
            display: flex;
            justify-content: center;
            z-index: 10;
        }
        .logo-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            background-color: #6b1535;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }
        .logo-title {
            font-size: 1.35rem;
            font-weight: 500;
            font-family: 'Georgia', serif;
            letter-spacing: 0.5px;
        }
        .logo-sub {
            font-size: 0.75rem;
            font-style: italic;
            font-family: 'Georgia', serif;
            text-align: center;
            line-height: 1.1;
            margin-top: 2px;
        }

        /* Textos de encabezado */
        .header-text {
            text-align: center;
            margin-top: 15px;
            padding: 0 20px;
        }
        .header-text h1 {
            color: #d84b72;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 5px;
        }
        .header-text p {
            color: #a8949a;
            font-size: 0.95rem;
        }

        .content { padding: 25px 22px; }

        /* Tarjeta Inteligente de Mesa */
        .table-card {
            background-color: #29111b;
            border-radius: 16px;
            padding: 22px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border: 1px solid #3d1b28;
        }
        .table-number {
            font-size: 3.5rem;
            font-weight: 800;
            color: #d84b72;
            line-height: 1;
            text-align: center;
            min-width: 50px;
        }
        .table-number span {
            display: block;
            font-size: 0.7rem;
            font-weight: 500;
            color: #a8949a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .table-info h2 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .table-info p {
            font-size: 0.85rem;
            color: #b5a4a9;
            line-height: 1.4;
        }

        /* Separador de Sección Punteado */
        .section-title {
            text-align: center;
            color: #d84b72;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .section-title::before, .section-title::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed #6b2a40;
        }

        /* Botones Rectangulares */
        .btn-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 14px;
            transition: transform 0.2s;
            border: none;
        }
        .btn-main:active { transform: scale(0.98); }
        
        .btn-menu { background-color: #6b1535; color: white; }
        .btn-whatsapp { background-color: #1f9e4e; color: white; } /* Un verde más sobrio para modo oscuro */

        /* Transferencia Bancaria Oscura */
        .bank-box {
            background-color: #29111b;
            border: 1px dashed #d84b72;
            border-radius: 16px;
            padding: 20px;
            margin: 25px 0;
            width: 100%;
            text-align: left;
            cursor: pointer;
            color: #f7e6ea;
            transition: background-color 0.2s;
        }
        .bank-box:active { background-color: #3d1b28; }
        
        .bank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .bank-header span:first-child { color: #d84b72; font-weight: 700; font-size: 1.05rem; }
        .copy-tag {
            background-color: #d84b72;
            color: white;
            font-size: 0.7rem;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
        }
        .bank-info { font-family: monospace; font-size: 0.95rem; line-height: 1.6; color: #d1c1c5; }
        .bank-info strong { color: #ffffff; font-family: sans-serif; }

        /* Cuadrícula inferior */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .action-btn {
            background-color: #29111b;
            border: 1px solid #3d1b28;
            border-radius: 14px;
            padding: 16px 5px;
            text-align: center;
            text-decoration: none;
            color: #f7e6ea;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn i { font-size: 1.5rem; color: #d84b72; font-style: normal; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Imagen superior difuminada -->
        <div class="banner"></div>
        
        <!-- Logo en Círculo -->
        <div class="logo-wrapper">
            <div class="logo-circle">
                <div class="logo-title">Endorfina</div>
                <div class="logo-sub">chocolatería y<br>café</div>
            </div>
        </div>

        <!-- Textos principales -->
        <div class="header-text">
            <h1>Endorfina chocolatería y café</h1>
            <p>Un espacio para consentirte</p>
        </div>

        <div class="content">
            <!-- Tarjeta Dinámica de Mesa (Cambia con la URL y la hora) -->
            <div class="table-card">
                <div class="table-number">
                    <span id="display-mesa">1</span>
                    <span>Mesa</span>
                </div>
                <div class="table-info">
                    <h2 id="greeting-text">Hola, mesa 1</h2>
                    <p>Pide, paga y cuéntanos cómo va todo desde aquí.</p>
                </div>
            </div>

            <!-- Título de sección -->
            <div class="section-title">
                <span>☕ Menú & Pedidos</span>
            </div>

            <!-- Botones Principales -->
            <a href="https://tusitio.com/menu" class="btn-main btn-menu">📖 Ver menú digital</a>
            <a href="https://wa.me/525611107651" class="btn-main btn-whatsapp">💬 Pedir por WhatsApp</a>

            <!-- Recuadro Bancario Copiable -->
            <button onclick="navigator.clipboard.writeText('012180015679754088'); alert('¡CLABE copiada al portapapeles!');" class="bank-box">
                <div class="bank-header">
                    <span>🏦 Pagar por transferencia</span>
                    <span class="copy-tag">Copiar CLABE</span>
                </div>
                <div class="bank-info">
                    <strong>Banco:</strong> BBVA Bancomer<br>
                    <strong>CLABE:</strong> 012 180 01567975408 8<br>
                    <strong>Beneficiario:</strong> Edgar Ruiz
                </div>
            </button>

            <!-- Acciones Secundarias -->
            <div class="action-grid">
                <a href="https://maps.google.com" class="action-btn">
                    <i>📍</i>
                    Ubicación y<br>sucursales
                </a>
                <a href="https://search.google.com/local/writereview?placeid=PLACE_ID_AQUI" class="action-btn">
                    <i>⭐</i>
                    Reseña en<br>Google Maps
                </a>
                <a href="https://instagram.com" class="action-btn">
                    <i>📸</i>
                    Nuestras<br>Redes
                </a>
            </div>
        </div>
    </div>

    <!-- Script de Inteligencia (Lee la URL y la hora) -->
    <script>
        // 1. Obtiene la mesa desde la URL (ejemplo: ?mesa=3)
        const urlParams = new URLSearchParams(window.location.search);
        let numMesa = urlParams.get('mesa') || '1'; 

        // 2. Coloca el número en el círculo grande
        document.getElementById('display-mesa').innerText = numMesa;
        
        // 3. Saluda al cliente dependiendo de la hora real en México
        const hora = new Date().getHours();
        let saludo = 'Hola';
        if (hora >= 5 && hora < 12) saludo = 'Buenos días';
        else if (hora >= 12 && hora < 19) saludo = 'Buenas tardes';
        else saludo = 'Buenas noches';

        // 4. Escribe el texto en la tarjeta
        document.getElementById('greeting-text').innerText = `${saludo}, mesa ${numMesa}`;
    </script>
</body>
</html>
