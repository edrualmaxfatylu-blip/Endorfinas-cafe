<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endorfina Chocolatería y Café</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #2c0e19, #4a1529, #1a080f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            color: #333;
        }
        .card {
            background: rgba(255, 252, 250, 0.98);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .banner {
            width: 100%;
            height: 155px;
            background-image: url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .banner::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 50px;
            background: linear-gradient(to top, rgba(255,252,250,0.98), transparent);
        }
        .profile-container {
            position: relative;
            margin-top: -70px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 5px solid #fffefa;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(74,21,41,0.25);
            background-color: white;
        }
        .content { padding: 0 28px 35px; }
        h1 { font-size: 1.6rem; color: #4a1529; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
        .subtitle { font-size: 0.95rem; color: #7c2d43; margin-bottom: 28px; font-weight: 500; }
        
        .bank-btn {
            width: 100%;
            background: #fff5f7;
            border: 2px dashed #d97706;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 28px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            font-family: inherit;
        }
        .bank-btn:hover { background: #fef3c7; transform: translateY(-2px); }
        .bank-btn:active { transform: scale(0.98); }
        .bank-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .bank-header h3 { font-size: 1rem; color: #92400e; margin: 0; }
        .copy-badge {
            margin-left: auto;
            background: #d97706;
            color: white;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .bank-data { font-size: 0.9rem; color: #451a03; line-height: 1.6; font-family: monospace; }
        .bank-data strong { color: #92400e; font-family: sans-serif; }

        .btn-group { display: flex; flex-direction: column; gap: 16px; }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn:active { transform: scale(0.97); }
        
        .btn-menu { background: #4a1529; color: #ffffff; }
        .btn-order { background: linear-gradient(135deg, #10b981, #047857); color: #ffffff; }
        .btn-review { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #ffffff; }
        .btn-ig { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); color: #ffffff; }
        
        .footer { margin-top: 35px; font-size: 0.8rem; color: #a3a3a3; font-weight: 500; letter-spacing: 0.5px; }
        .footer strong { color: #7c2d43; }
    </style>
</head>
<body>
    <div class="card">
        <div class="banner"></div>
        <div class="profile-container">
            <img class="profile-img" src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=400&q=80" alt="Logo Endorfina">
        </div>
        <div class="content">
            <h1>Endorfina</h1>
            <p class="subtitle">Chocolatería y Café</p>
            
            <button onclick="navigator.clipboard.writeText('012180015679754088'); alert('¡CLABE copiada al portapapeles!');" class="bank-btn">
                <div class="bank-header">
                    <h3>🏦 Datos para Transferencia</h3>
                    <span class="copy-badge">Toca para Copiar</span>
                </div>
                <div class="bank-data">
                    <strong>Banco:</strong> BBVA Bancomer<br>
                    <strong>CLABE:</strong> 012 180 01567975408 8<br>
                    <strong>Beneficiario:</strong> Edgar Ruiz
                </div>
            </button>

            <div class="btn-group">
                <a href="https://tusitio.com/menu" class="btn btn-menu">📖 Ver Menú Digital</a>
                <a href="https://wa.me/525611107651" class="btn btn-order">💬 Pedir por WhatsApp (Sucursal)</a>
                <a href="https://search.google.com/local/writereview?placeid=PLACE_ID_AQUI" class="btn btn-review">⭐ Califícanos en Google</a>
                <a href="https://instagram.com" class="btn btn-ig">📸 Síguenos en Instagram</a>
            </div>
            
            <div class="footer">Hecho con ♥ para <strong>Endorfina</strong></div>
        </div>
    </div>
</body>
</html>
